function publicLanding(){return `<div class="public-shell"><div class="public-demo-strip">${I('info',14)} Clickable design preview · No real evidence uploads, emails, payments or ODPC submissions</div><header class="public-nav"><div class="public-container"><div class="public-brand"><div class="brand-mark">${I('shield')}</div>privacyguard<span style="color:#0b8078">.</span></div><nav class="public-navlinks"><a href="#benefits">Benefits</a><a href="#odpc-explainer">ODPC & compensation</a><a href="#how">How it works</a><a href="#pricing">Fees</a><a href="#faq">Questions</a></nav><div class="public-navbtn"><button class="button outline sm" data-action="publicOps">Operations demo</button><button class="button primary sm" data-action="publicDashboard">My dashboard ${I('arrow',13)}</button></div></div></header><section class="public-hero"><div class="public-container hero-layout"><div class="hero-copy"><span class="public-badge">${I('shield',14)} Your privacy rights · ODPC complaints supported</span><h1>Unwanted messages? <em>You can take action through the ODPC.</em></h1><p>Stop unwanted promotional messages, challenge how a company used your number, and explore an ODPC complaint and possible compensation <b>where justified</b>. Start by uploading evidence for review.</p><button class="button primary" data-action="publicCheck">Upload a message · Check my options ${I('arrow',17)}</button><div class="hero-trust">${I('checkCircle',16)} Free message check · ODPC filing is free · Paid help is optional</div></div><div class="public-preview"><div class="public-preview-screen"><div class="preview-mini-head"><b style="color:#173849">PrivacyGuard</b><span>${I('lock',14)} Private check</span></div><h2 style="margin-top:22px;font-size:27px;color:#0c2b3d">A privacy complaint may go beyond stopping messages.</h2><p class="muted small" style="margin:11px 0 14px">If there may have been an unlawful use of your data, we can help you understand the ODPC process and remedies.</p><div class="mini-report"><div class="mini-icon">${I('message')}</div><div><strong>Unwanted loan promotion</strong><p>SMS received · sender unknown</p></div>${I('chevron',15)}</div><div class="mini-report"><div class="mini-icon">${I('scale')}</div><div><strong>ODPC &amp; possible compensation</strong><p>Escalate where justified; ODPC decides</p></div>${I('chevron',15)}</div><div style="margin-top:20px">${progressPreview()}</div><div class="fee-note">Your free check comes first. Optional assistance fees are shown before you authorise any paid work.</div></div></div></div></section><section class="landing-section" id="benefits"><div class="public-container"><div class="section-kicker">What we can help you do</div><h2 class="section-title">Take back control of your information</h2><p class="section-intro">Don't learn the legal process first. Start with the outcome you want.</p><div class="tiles-3"><div class="benefit-card"><div class="icon-tile teal">${I('message',23)}</div><h3>Ask them to stop</h3><p>Object to unwanted promotional contact and keep a record of what happens after you ask.</p></div><div class="benefit-card"><div class="icon-tile">${I('search',23)}</div><h3>Find out how they got your number</h3><p>Ask a company about the source of your personal information and any marketing permission it relies on.</p></div><div class="benefit-card"><div class="icon-tile amber">${I('scale',23)}</div><h3>ODPC complaint &amp; compensation</h3><p>Where the evidence supports a potential privacy violation and qualifying harm, we help you explore an ODPC complaint and the possibility of compensation.</p></div></div></div></section><section class="landing-section odpc-education" id="odpc-explainer"><div class="public-container"><div class="odpc-layout"><div><div class="section-kicker">Know the official route</div><h2 class="section-title">The ODPC can hear your complaint. Compensation may be available.</h2><p class="odpc-lead">Kenya’s Office of the Data Protection Commissioner (ODPC) receives personal-data complaints. If marketing messages raise a genuine privacy concern, we can help you organise the evidence and understand how to take the matter forward.</p><div class="odpc-facts"><div><span class="odpc-tick">${I('check',15)}</span><span><b>ODPC complaints are free to file.</b> You may submit a complaint yourself or use a properly authorised representative.</span></div><div><span class="odpc-tick">${I('check',15)}</span><span><b>Stopping messages is not always the whole issue.</b> A past use of your information can still merit review.</span></div><div><span class="odpc-tick">${I('check',15)}</span><span><b>Compensation depends on evidence and damage.</b> It is not payable automatically for every message.</span></div></div><div class="odpc-actions"><button class="button primary" data-action="publicCheck">Check my ODPC options ${I('arrow',15)}</button><a href="https://www.odpc.go.ke/file-a-complaint/" target="_blank" rel="noopener noreferrer" class="official-link">ODPC official complaint information ${I('link',14)}</a></div></div><div class="odpc-visual"><div class="odpc-visual-top"><span>${I('scale',19)} Example complaint journey</span><span class="pill teal">Independent review</span></div><div class="odpc-visual-steps"><div class="ov-step"><span class="ov-num">01</span><div><b>Evidence gathered</b><small>Message, sender, dates and opt-out history</small></div></div><div class="ov-step"><span class="ov-num">02</span><div><b>Company asked to explain</b><small>Consent records and response tracked, where appropriate</small></div></div><div class="ov-step highlight"><span class="ov-num">03</span><div><b>ODPC complaint, if warranted</b><small>You authorise preparation and filing separately</small></div></div><div class="ov-step"><span class="ov-num">04</span><div><b>ODPC determines the matter</b><small>May dismiss, require corrective action or order compensation where justified</small></div></div></div><div class="odpc-visual-foot">No automatic ODPC filing. No guaranteed award. No percentage-of-compensation promise.</div></div></div></div></section><section class="landing-section" style="background:#f5f9fa" id="how"><div class="public-container"><div class="section-kicker">Simple from the start</div><h2 class="section-title">Four clear steps. No legal jargon.</h2><p class="section-intro">Only provide the details needed for your next step. You decide whether to continue.</p><div class="tiles-4"><div class="public-step"><b>1</b><strong>Show the message</strong><p>Upload a screenshot or describe the unwanted contact.</p></div><div class="public-step"><b>2</b><strong>Understand your options</strong><p>See which privacy rights and next steps may apply.</p></div><div class="public-step"><b>3</b><strong>Choose your help</strong><p>Use free self-service resources or opt into assistance.</p></div><div class="public-step"><b>4</b><strong>Track ODPC &amp; possible remedies</strong><p>See whether a case is still with the company, prepared for ODPC, filed, acknowledged or determined.</p></div></div><div style="text-align:center;margin-top:25px"><button class="button primary" data-action="publicCheck">Try the free message check ${I('arrow',16)}</button></div></div></section><section class="landing-section" id="pricing"><div class="public-container" style="max-width:860px"><div class="section-kicker">Transparent choices</div><h2 class="section-title">Start free. Pay only if you choose help.</h2><p class="section-intro">You can file with ODPC yourself at no charge. PrivacyGuard is independent and offers optional paid administrative assistance.</p><div class="tiles-2"><div class="card" style="padding:27px"><span class="pill gray">Self-service</span><h2 style="margin:15px 0">KSh 0</h2><p>Understand the steps, organise a basic report and visit the official complaints portal yourself.</p><button class="button outline full" data-action="publicCheck">Start free</button></div><div class="card" style="padding:27px;border-color:#87c5bc;box-shadow:0 8px 25px #0e7a7030"><span class="pill teal">Optional assistance</span><h2 style="margin:15px 0">From KSh 199</h2><p>Help preparing your authorised company request, organising evidence and tracking replies. Exact fees appear before purchase.</p><button class="button primary full" data-action="publicCheck">See how it works</button></div></div><div class="letter-note">PrivacyGuard never charges an ODPC filing fee. No hidden filing fee, automatic upgrade, subscription or promised award. More complex administrative assistance, if offered, is separately disclosed.</div></div></section><section class="landing-section" id="faq" style="padding-top:35px"><div class="public-container" style="max-width:850px"><div class="section-kicker">Good to know</div><h2 class="section-title">Common questions</h2><div class="landing-faq"><details><summary>Can I still complain if the company stops the messages?</summary><p>Yes, a potential past violation may remain. Whether further action is warranted depends on the facts, consent evidence and any harm. Stopping messages does not guarantee compensation.</p></details><details><summary>Do I have to pay to file with ODPC?</summary><p>No. Official ODPC complaint filing is free. PrivacyGuard's optional fees are for clearly identified assistance, not for access to the regulator.</p></details><details><summary>Do you share my case with other consumers?</summary><p>No. Cases are individual and private. Group claims are not offered in this initial version.</p></details><details><summary>Could ODPC award me compensation for unwanted messages?</summary><p>Possibly, but only where the relevant legal requirements are met. The ODPC assesses the complaint and available evidence, including harm such as distress where applicable. Filing a complaint does not mean a payment will follow, and decisions may be challenged.</p></details><details><summary>If a company stops messaging me, can I still ask ODPC to investigate?</summary><p>Yes, if a genuine concern remains about past use of your personal data. Stopping marketing may resolve the immediate problem but does not automatically erase past conduct. The outcome depends on the facts.</p></details></div></div></section><section class="landing-section" style="padding-top:5px"><div class="public-container"><div class="public-cta-band"><div><h2>Your message could be the start of an ODPC privacy complaint.</h2><p>Begin with a free evidence check. We will explain the company-first option, ODPC escalation and when compensation might be considered.</p></div><button class="button white" data-action="publicCheck">Check my message ${I('arrow',16)}</button></div></div></section><footer class="public-footer"><div class="public-container"><div class="public-footgrid"><div><div class="public-brand"><div class="brand-mark">${I('shield')}</div>privacyguard.</div><p style="margin:13px 0 0;color:#9ab2bf">Consumer-first privacy assistance · Kenya</p></div><div style="max-width:470px;line-height:1.9">Independent demonstration product, not affiliated with ODPC. Official ODPC filing is free. Compensation is never guaranteed. Demo content and sample case records are fictional.</div></div></div></footer></div>`}

function serviceChoicePage(){let c=getCase();return `<button class="txtbtn" data-action="openCase">${I('back')} Back to case</button><div class="page-header" style="margin-top:17px"><div><div class="eyebrow">${I('shield')} YOUR CHOICE</div><h1>How would you like to continue?</h1><p>Your report for ${esc(c.company)} is saved privately. You can choose your own next step after reviewing your options.</p></div></div><div class="tiles-2 service-options"><div class="card"><span class="pill gray">Self-service</span><h2 style="margin:15px 0">Free</h2><p>Use our rights guidance, prepare a standard notice and go to the official ODPC portal without a filing fee.</p><div class="letter-note">You send your own notices and track the replies.</div><div style="margin-top:16px">${Btn('Continue for free','chooseFree','outline full')}</div></div><div class="card" style="border-color:#8bc7c0"><span class="pill teal">Optional assisted path</span><h2 style="margin:15px 0">KSh 199 <span class="tiny muted" style="font-weight:500">proposed one-time fee</span></h2><p>Help organising evidence, preparing your authorised company request and tracking its response.</p><div class="letter-note">No money is collected in this demo. In production, show the full fee before any M-Pesa authorisation.</div><div style="margin-top:16px">${Btn('Preview assisted process','chooseAssist','primary full')}</div></div></div><div class="notice" style="margin-top:16px">${I('scale')} <b>Want to pursue an ODPC complaint or possible compensation?</b> If a concern remains after the company response, you can request an evidence review and decide whether to prepare a complaint. ODPC filing itself is free; any additional PrivacyGuard help would be separately explained before purchase. ${Btn('Learn about ODPC & compensation','viewCompensation','outline')}</div>`}
function progressPreview(){return `<div class="mile-row"><div class="mile-item done"><span class="mile-number">✓</span><span>Evidence</span></div><i class="mile-connector done"></i><div class="mile-item done"><span class="mile-number">✓</span><span>Company</span></div><i class="mile-connector"></i><div class="mile-item current"><span class="mile-number">3</span><span>Response</span></div><i class="mile-connector"></i><div class="mile-item"><span class="mile-number">4</span><span>Next step</span></div></div>`}
function isReply(c){return !!c.response||['resolution','review','unresolved','pack','submitted','odpc','closed'].includes(c.status)}
function wasNotice(c){return c.events.some(e=>/notice sent|notice prepared/i.test(e.title))||['waiting','resolution','review','unresolved','pack','submitted','odpc','closed'].includes(c.status)}
function caseProgress(c,compact=false){const co=getCompany(c.company),v=!!(co&&co.verified),sent=wasNotice(c),rep=isReply(c),done=[c.files.length>0,!!c.screened,!!c.screened&&v,sent,rep],total=done.filter(Boolean).length;let current=c.status==='closed'?'Closed at consumer request':c.status==='odpc'?'ODPC acknowledged (example only)':c.status==='submitted'?'Submitted, awaiting acknowledgement':c.status==='pack'?'ODPC pack ready, not submitted':c.status==='resolution'?'Consumer decision needed':c.status==='review'?'Company reply under review':c.status==='waiting'?'Waiting for company reply':c.status==='verify'?'Evidence and company verification pending':'Building your evidence record';if(compact)return `<div class="case-progress-mini" aria-label="Company stage ${total} of 5"><span style="width:${total*20}%"></span></div><div class="tiny muted">Company stage ${total} of 5 · ${esc(current)}</div>`;let st=['Evidence recorded','Evidence screened','Company verified','Notice recorded','Reply received'];let items=st.map((lab,i)=>`<div class="mile-item ${done[i]?'done':i===total?'current':''}"><span class="mile-number">${done[i]?'✓':i+1}</span><span>${lab}</span></div>`).join('<i class="mile-connector"></i>');let odpcPhase=['pack','submitted','odpc'].includes(c.status),odpcStatus=c.status==='pack'?'Pack prepared · not filed':c.status==='submitted'?'Submitted · acknowledgement pending':c.status==='odpc'?'Acknowledged · awaiting regulator decision':'Not required unless you choose to escalate';return `<section class="milestone-card"><div class="mile-header"><div><h3>Where is my case?</h3><div class="mile-kicker">Company stage · individual complaint</div></div>${Pill(c.status==='closed'?'Closed':odpcPhase?'Regulator pathway':'In progress',c.status==='closed'?'gray':odpcPhase?'teal':'amber')}</div><div class="mile-row">${items}</div><div class="mile-meter"><span style="width:${total*20}%"></span></div><div class="mile-summary">${total} of 5 company-stage milestones recorded. Not an estimate of time remaining.</div><div class="mile-note"><b>Current update:</b> ${esc(current)}${c.status==='resolution'?'. A company saying it stopped marketing does not close your case.':''}</div><div class="odpc-branch">${I('scale',18)}<div style="flex:1"><strong>ODPC complaint pathway · ${esc(odpcStatus)}</strong><p>If the past use of your data may have violated the law, this remains an option even after marketing stops. Each official step requires its own evidence and authorisation.</p><div class="odpc-mini-stages"><span class="${odpcPhase?'complete':''}">Prepare</span><span class="${['submitted','odpc'].includes(c.status)?'complete':''}">File</span><span class="${c.status==='odpc'?'complete':''}">Acknowledged</span><span>ODPC decision</span></div><div class="comp-small-note"><b>Possible compensation:</b> Only if justified by the violation and qualifying damage; never automatic. An ODPC decision can be appealed.</div>${Btn('Understand ODPC & compensation','viewCompensation','outline sm')}</div></div></section>`}
function commPill(c){return ({received:['Reply received','teal'],sent:['Sent (demo)','gray'],submitted:['Submission recorded','amber'],acknowledged:['Acknowledged (demo)','teal'],action:['Reply needed','amber'],failed:['Delivery failed','red']}[c.status]||['Logged','gray'])}
function commRow(c,withAction=true){const p=commPill(c),isIn=c.direction==='in',urgent=c.status==='action';return `<div class="activity-row ${isIn?'in':'out'} ${urgent?'urgent':''}"><div class="acticon">${I(isIn?'mail':'send',17)}</div><div class="act-body"><div class="topline"><h4>${esc(c.title)}</h4>${Pill(c.audience==='odpc'?'ODPC':'Company',c.audience==='odpc'?'teal':'gray')}</div><p>${esc(c.detail)}<br><span style="color:#8fa1ab">${esc(c.contact)}</span></p><div class="activity-meta">${Pill(p[0],p[1])}<time>${esc(c.date)} · ${esc(c.caseId)}</time></div></div>${withAction?`<button class="button outline sm" data-ops-case="${esc(c.caseId)}">View</button>`:''}</div>`}
function overallPipeline(){let stages=[{t:'Intake / verification',n:state.cases.filter(c=>['draft','verify'].includes(c.status)).length,c:'#8aa5b5',f:'intake'},{t:'Awaiting company',n:state.cases.filter(c=>['waiting','contact'].includes(c.status)).length,c:'#4384b9',f:'company'},{t:'Reply / review',n:state.cases.filter(c=>['review','unresolved','resolution'].includes(c.status)).length,c:'#d9a247',f:'review'},{t:'ODPC pathway',n:state.cases.filter(c=>['pack','submitted','odpc'].includes(c.status)).length,c:'#0b8a7b',f:'odpc'},{t:'Closed',n:state.cases.filter(c=>c.status==='closed').length,c:'#587a72',f:'closed'}];let total=state.cases.length;return `<div class="card"><div class="topline"><h3>Overall case progress</h3>${Pill('Calculated from demo cases','outline')}</div><p style="margin-top:7px">How cases are distributed across the workflow. Not a completion percentage or compensation forecast.</p><div class="ops-progressbar" aria-label="Case pipeline distribution">${stages.map(x=>x.n?`<span title="${x.t}: ${x.n}" style="background:${x.c};width:${x.n/total*100}%"></span>`:'').join('')}</div><div class="pipeline-key">${stages.map(x=>`<button data-action="toQueue"><b>${x.n}</b><span><i style="background:${x.c}"></i>${x.t}</span></button>`).join('')}</div></div>`}
function opsInbox(){let f=state.mailFilter;let selected=state.communications.filter(c=>f==='all'||(f==='odpc'&&c.audience==='odpc')||(f==='companies'&&c.audience==='company')||(f==='incoming'&&c.direction==='in')||(f==='attention'&&c.status==='action'));return `<div class="page-header"><div><div class="eyebrow">${I('mail')} ALL CORRESPONDENCE</div><h1>Email & regulator activity</h1><p>What was sent, what came back, what was recorded, and which regulator messages still need a response.</p></div>${Pill('Demo-only messages','amber')}</div><div class="tiles-4"><div class="stat-card"><div class="stat-label">Outgoing emails / submissions</div><div class="stat-num">${state.communications.filter(c=>c.direction==='out').length}</div><div class="stat-note">Not real transmissions</div></div><div class="stat-card"><div class="stat-label">Incoming replies</div><div class="stat-num">${state.communications.filter(c=>c.direction==='in').length}</div><div class="stat-note">Company + regulator</div></div><div class="stat-card"><div class="stat-label">ODPC interactions</div><div class="stat-num">${state.communications.filter(c=>c.audience==='odpc').length}</div><div class="stat-note">Includes portal activity</div></div><div class="stat-card"><div class="stat-label">Replies needing action</div><div class="stat-num">${state.communications.filter(c=>c.status==='action').length}</div><div class="stat-note">Reviewer must assess</div></div></div><div class="mail-split" style="margin-top:20px"><div class="card"><h3>Communication register</h3><div class="mail-filter-row">${[['all','All'],['incoming','Received'],['companies','Companies'],['odpc','ODPC'],['attention','Needs reply']].map(([v,t])=>`<button class="filter ${f===v?'active':''}" data-mailfilter="${v}">${t}</button>`).join('')}</div>${selected.length?selected.map(c=>commRow(c)).join(''):'<div class="empty"><strong>No messages for this filter</strong><p>Choose another category.</p></div>'}</div><div class="panel-stack"><div class="card"><h3>Meaning of message statuses</h3><div class="timeline" style="margin-top:15px"><div class="event"><strong>Sent</strong><p>A notice is recorded as sent. This does not prove the recipient read it.</p></div><div class="event"><strong>Received</strong><p>Incoming correspondence is matched to the correct case and preserved.</p></div><div class="event"><strong>ODPC acknowledgement</strong><p>Only regulator-issued reference details should confirm acknowledgement.</p></div><div class="event"><strong>Action required</strong><p>Review the request, assign owner and record the verified response.</p></div></div></div><div class="notice warn">${I('alert')} This standalone HTML file uses fictional inbox events. It is not connected to an email mailbox or the ODPC. Actual integrations need authentication, secure record storage and delivery callbacks.</div></div></div>`}
function openMain(){let v=state.view;return state.role==='consumer'?({home:homePage,report:reportPage,cases:casesPage,detail:detailPage,service:serviceChoicePage,consent:consentPage,consentReview:consentReviewPage,resolution:resolutionPage,odpc:odpcPage,compensation:compensationPage,help:helpPage}[v]||homePage)():({overview:opsOverview,queue:opsQueue,inbox:opsInbox,companies:opsCompanies,opsCase:opsCase,odpcops:opsODPC,settings:opsSettings}[v]||opsOverview)()}
function render(scroll=true){document.documentElement.lang=state.language==='sw'?'sw':'en';if(state.role==='public'){document.getElementById('root').innerHTML=publicLanding();renderModal();if(scroll)window.scrollTo({top:0,behavior:'instant'});return;}document.getElementById('root').innerHTML=`<div class="app-shell">${sidebar()}<div class="main-shell">${topbar()}${demoBanner()}<main class="page">${openMain()}</main></div></div>${bottomNav()}`;renderModal();if(scroll)window.scrollTo({top:0,behavior:'instant'});}
function homePage(){let pending=state.cases.filter(c=>c.status==='resolution'||c.status==='review').length;let waiting=state.cases.filter(c=>c.status==='waiting').length;return `<div class="eyebrow">${I('shield',15)} Your private case workspace</div><section class="hero"><div class="hero-content"><div class="eyebrow">ONE SIMPLE START · ALL YOUR OPTIONS</div><h1>Received unwanted messages? Start with the evidence.</h1><p>Upload the message once. We'll help check the details, prepare a company request if appropriate, and explain your ODPC and possible compensation options.</p><div class="hero-actions">${Btn(`Upload a message ${I('arrow',16)}`,'startReport','white')}${Btn('How the process works','showHow','outline')}</div><p class="tiny" style="color:#d0e7ee;margin-top:12px">Free to check · No company contacted without your permission · ODPC filing is free</p></div><div class="hero-illustration"><div class="hero-symbol">${I('shield',70)}</div><div class="bubble one">${I('checkCircle',14)} Private evidence</div><div class="bubble two">${I('lock',14)} Your approval</div></div></section><div class="section-head"><h2>One report. Three possible outcomes.</h2><span class="tiny muted">You do not need to choose now</span></div><div class="tiles-3"><div class="card" style="padding:22px"><div class="icon-tile teal">${I('message')}</div><h3 style="margin-top:13px">Stop unwanted messages</h3><p class="muted small">We help you object to direct marketing and document the company's response.</p></div><div class="card" style="padding:22px"><div class="icon-tile">${I('search')}</div><h3 style="margin-top:13px">Check the company's explanation</h3><p class="muted small">Request details of how your number was obtained and what consent the company relies on.</p></div><div class="card" style="padding:22px"><div class="icon-tile amber">${I('scale')}</div><h3 style="margin-top:13px">ODPC & possible compensation</h3><p class="muted small">Where warranted, review the evidence and choose whether to pursue an ODPC complaint. Compensation is not guaranteed.</p></div></div><div class="section-head"><h2>Your cases</h2><span class="tiny muted">Example account data</span></div><div class="tiles-3"><div class="stat-card"><div class="stat-label">${T('active')}</div><div class="stat-num">${countActive()}</div><div class="stat-note">Private cases</div></div><div class="stat-card"><div class="stat-label">${T('waiting')}</div><div class="stat-num">${waiting}</div><div class="stat-note">Company response</div></div><div class="stat-card"><div class="stat-label">${T('attention')}</div><div class="stat-num">${pending}</div><div class="stat-note">Action needed</div></div></div><div class="layout-2" style="margin-top:21px"><div class="panel-stack"><div class="card"><div class="topline"><h3>What needs your attention</h3>${Pill('Action available','teal')}</div><div class="next-action" style="margin-top:13px"><div class="topline"><strong>${I('message',17)} Jirani Credit · PG-1042</strong>${Pill('Awaiting your decision','teal')}</div><p>The company says marketing has stopped. Choose whether this settles the matter or whether you want us to review past conduct and possible ODPC escalation.</p>${caseProgress(getCase('PG-1042'),true)}${Btn(`Review company response ${I('arrow')}`,'openResolution','primary')}</div></div><div class="card"><div class="topline"><h3>${T('recent')}</h3><button class="txtbtn" data-nav="cases">${T('see')} ${I('chevron',14)}</button></div><div style="margin-top:17px">${state.cases.slice(0,3).map(caseItem).join('')}</div></div></div><div class="panel-stack"><div class="card"><div class="icon-tile teal">${I('clipboard')}</div><h3 style="margin-top:13px">Your report follows one clear path</h3><div class="timeline"><div class="event"><strong>1. Evidence received</strong><p>Upload a message and confirm the information is accurate.</p></div><div class="event"><strong>2. PrivacyGuard verification</strong><p>We check the evidence and identify the responsible company. Suspicious or unclear reports need human review.</p></div><div class="event"><strong>3. Company contact (only with approval)</strong><p>We prepare a request, confirm the recipient and monitor the company's reply.</p></div><div class="event"><strong>4. Your decision</strong><p>Accept a resolution, request more information or authorise an ODPC complaint where warranted.</p></div><div class="event"><strong>5. ODPC handles the complaint, if filed</strong><p>We track verified regulator milestones. Compensation, if any, is ODPC's decision.</p></div></div></div><div class="notice">${I('lock',18)} <p>Reports are private. Filing at ODPC is free. PrivacyGuard's optional assistance is priced before purchase.</p></div></div></div>`}

function caseItem(c){return `<div class="case-item"><div class="case-icon">${I(c.status==='odpc'?'scale':'message')}</div><div class="case-info"><strong>${esc(c.company)}</strong><small>${esc(c.id)} · ${esc(c.channel)} · ${esc(c.sender)}</small>${caseProgress(c,true)}<button class="txtbtn" data-open-case="${esc(c.id)}">View case ${I('chevron',13)}</button></div><div class="case-end">${Status(c.status)}</div></div>`}
function reportPage(){let r=state.report;let steps=['Evidence','Sender & context','Your options','Review'];return `<div class="page-header"><div><div class="eyebrow">${I('lock',15)} ${T('caseLabel')}</div><h1>${T('reportTitle')}</h1><p>${T('reportSub')}</p></div>${Pill('Step '+state.reportStep+' of 4','teal')}</div><div class="wizard-layout"><div class="card wizard-card"><div class="steps">${steps.map((s,i)=>`<div class="step ${i+1<state.reportStep?'done':i+1===state.reportStep?'current':''}"><span class="step-dot">${i+1<state.reportStep?'✓':i+1}</span><span>${s}</span></div>`).join('')}</div><div class="progress-line"><span style="width:${state.reportStep*25}%"></span></div>${state.reportStep===1?`<h2 class="wizard-title">Step 1: Upload the message you received</h2><p class="muted small">Start with the original message. We will assess it before any company notice is prepared.</p><div class="radio-options" style="grid-template-columns:1fr 1fr">${['SMS','WhatsApp','Email','Phone call'].map(ch=>`<label class="choice"><input type="radio" name="channel" value="${ch}" ${r.channel===ch?'checked':''}><b>${ch}</b></label>`).join('')}</div><div style="height:18px"></div><label class="upload-zone">${I('upload',24)}<div><b>${r.filename?esc(r.filename):'Add a screenshot or document'}</b><small>PNG, JPG, PDF · Preview only, never uploaded</small></div><input type="file" id="evidenceInput" accept="image/png,image/jpeg,application/pdf" /></label><div class="notice" style="margin-top:15px">${I('info')} Keep the original message on your phone. Screenshots are reviewed for inconsistencies; phone OTP alone does not prove a message is genuine.</div>`:state.reportStep===2?`<h2 class="wizard-title">Step 2: Who sent this?</h2><p class="muted small">If you aren't sure, that's fine. Our review team can help identify the company.</p><div class="form-row"><div class="field"><label for="sender">Sender name or number</label><input id="sender" value="${esc(r.sender)}" placeholder="e.g. LOANMSG" maxlength="80"></div><div class="field"><label for="received">Date received (optional)</label><input id="received" type="date" value="${esc(r.date)}"></div></div><div class="field"><label for="company">Company or brand (if known)</label><input id="company" value="${esc(r.company)}" placeholder="I don't know" maxlength="100"><small>A sender ID isn't always proof of the legal company behind a message.</small></div><div class="form-row"><div class="field"><label for="relationship">Have you used their service?</label><select id="relationship"><option value="unknown" ${r.relationship==='unknown'?'selected':''}>I'm not sure</option><option value="yes" ${r.relationship==='yes'?'selected':''}>Yes</option><option value="no" ${r.relationship==='no'?'selected':''}>No</option><option value="former" ${r.relationship==='former'?'selected':''}>Previously, but not now</option></select></div><div class="field"><label for="opted">Have you asked them to stop?</label><select id="opted"><option value="unknown" ${r.opted==='unknown'?'selected':''}>I'm not sure</option><option value="yes" ${r.opted==='yes'?'selected':''}>Yes</option><option value="no" ${r.opted==='no'?'selected':''}>No</option></select></div></div><div class="field"><label for="notes">Anything else? (optional)</label><textarea id="notes" placeholder="A short description is enough...">${esc(r.notes)}</textarea></div>`:state.reportStep===3?`<h2 class="wizard-title">Step 3: What matters to you?</h2><p class="muted small">These are your possible goals, not separate case journeys. You'll make the ODPC decision later, after reviewing the company response.</p><div class="radio-options">${[['stop','Stop promotional messages','I want this company to stop sending me marketing.','message'],['check','Find out how my number was used','Ask about the source of my details and any marketing consent.','search'],['both','Both of the above','Stop marketing and understand what happened to my data.','shield'],['compensation','Explore an ODPC complaint and possible compensation','I want the evidence reviewed for potential ODPC escalation and any remedies justified by the facts.','scale']].map(([v,h,p,ic])=>`<label class="choice"><input name="goal" type="radio" value="${v}" ${r.goal===v?'checked':''}><span><b>${h}</b><small>${p}</small></span><span class="choice-icon">${I(ic)}</span></label>`).join('')}</div>`:`<h2 class="wizard-title">${T('reportPreview')}</h2><p class="muted small">Check the information before sending it for preliminary screening (prototype only).</p><div class="result-list"><div class="result-line"><span>Your goal</span><strong>${esc(goalText(r.goal))}</strong></div><div class="result-line"><span>Communication</span><strong>${esc(r.channel)}</strong></div><div class="result-line"><span>Sender</span><strong>${esc(r.sender||'Not provided')}</strong></div><div class="result-line"><span>Company</span><strong>${esc(r.company||'Needs identification')}</strong></div><div class="result-line"><span>Evidence</span><strong>${esc(r.filename||'Not attached')}</strong></div><div class="result-line"><span>Prior opt-out</span><strong>${esc(r.opted==='yes'?'Yes':r.opted==='no'?'No':'Not sure')}</strong></div></div><label class="check"><input id="reportAccurate" type="checkbox" ${r.confirmed?'checked':''}><span>I confirm I am reporting communications I actually received and the information is accurate to the best of my knowledge. I understand misleading submissions may be rejected.</span></label><div class="notice">${I('lock')} Submitting this report for review does <b>not</b> send a company notice or file an ODPC complaint. If a past privacy violation and qualifying harm are identified, you can separately authorise preparation for ODPC review. Compensation is not guaranteed.</div>`}<div class="wizard-actions"><button class="button outline" data-action="prevReport">${I('back')} ${T('back')}</button><button class="button primary" data-action="${state.reportStep===4?'submitReport':'nextReport'}">${state.reportStep===4?'Send for review (demo)':T('continue')} ${I('arrow')}</button></div></div><aside class="wizard-side"><div class="side-note"><div class="icon-tile teal">${I('shield')}</div><h3 style="margin-top:12px">You're in control</h3><ul><li>Every complaint stays separate and private.</li><li>We'll ask before contacting a company.</li><li>ODPC complaints are officially free.</li><li>ODPC escalation is a separate informed decision after company correspondence, unless early filing is justified.</li><li>Compensation depends on the facts and is never promised.</li></ul></div><div class="card flat" style="margin-top:14px"><h3>What happens after review?</h3><div class="timeline"><div class="event"><strong>Check evidence & company identity</strong><p>We review the original evidence, possible duplicates and the responsible company before proceeding.</p></div><div class="event"><strong>Confirm what you want requested</strong><p>Choose what the company should be asked.</p></div><div class="event"><strong>Approve contact</strong><p>Nothing is sent without your authorisation.</p></div></div></div></aside></div>`}
function goalText(v){return ({stop:'Stop marketing',check:'Check data use',both:'Stop marketing + check data',compensation:'Explore ODPC complaint / remedies'})[v]||'Check data use'}
function casesPage(){let filters=[['all','All'],['action','Needs action'],['active','Active'],['closed','Closed']];let cases=state.cases.filter(c=>state.caseFilter==='all'||(state.caseFilter==='action'?['resolution','review','verify','unresolved','pack'].includes(c.status):state.caseFilter==='active'?c.status!=='closed':c.status==='closed'));return `<div class="page-header"><div><div class="eyebrow">${I('folders')} PRIVATE CASES</div><h1>My cases</h1><p>Each complaint is yours. See what has happened and the next action required.</p></div>${Btn(`${I('plus')} New report`,'startReport','primary')}</div><div class="tiles-3"><div class="stat-card"><div class="stat-label">All reports</div><div class="stat-num">${state.cases.length}</div><div class="stat-note">Your private case records</div></div><div class="stat-card"><div class="stat-label">Open cases</div><div class="stat-num">${countActive()}</div><div class="stat-note">Including regulator cases</div></div><div class="stat-card"><div class="stat-label">Closed</div><div class="stat-num">${state.cases.length-countActive()}</div><div class="stat-note">Confirmed closure only</div></div></div><div class="card" style="margin-top:19px"><div class="topline"><h3>Case history</h3>${Pill('Demo account','gray')}</div><div class="filters">${filters.map(([v,t])=>`<button data-filter="${v}" class="filter ${state.caseFilter===v?'active':''}">${t}</button>`).join('')}</div>${cases.length?cases.map(caseItem).join(''):`<div class="empty">${I('folders',32)}<strong>No cases in this view</strong><p>Change the filter to see your other reports.</p></div>`}</div><div class="notice" style="margin-top:15px">${I('info')} A company saying it has stopped marketing does not automatically close your case. You choose what happens next.</div>`}
function detailPage(){let c=getCase(),co=getCompany(c.company);let next = c.status==='resolution'?['Review the company response','Choose whether to close the immediate concern or explore an ODPC complaint and possible compensation for past conduct.','openResolution']:c.status==='draft'||c.status==='verify'?['Evidence and sender verification','We are checking the report before contacting anyone. You can preview the next stage and any optional fees.','openService']:c.status==='waiting'?['Track the company response','We are waiting for a response. You can review the request already prepared.','openConsent']:c.status==='review'&&c.response==='consent'?['Review the company’s consent claim','The company claims permission was given. Compare its explanation with your record before deciding.','openConsentReview']:c.status==='closed'?['This case has been closed','You can reopen it in the prototype if new information becomes available.','reopenCase']:c.status==='odpc'?['Follow ODPC correspondence','Only verified regulator updates change an official case status.','openODPC']:['Prepare the next step','Review the evidence, then decide whether to ask for more information or prepare ODPC escalation.','openConsent'];return `<button class="txtbtn" data-nav="cases">${I('back')} Back to cases</button><div class="page-header" style="margin-top:14px"><div><div class="eyebrow">${I('lock')} INDIVIDUAL PRIVATE CASE · ${esc(c.id)}</div><h1>${esc(c.company)} <span style="font-size:19px;color:#70889a;font-weight:520">/ ${esc(c.sender)}</span></h1><p>${esc(c.channel)} marketing report · ${esc(goalText(c.goal))}</p></div>${Status(c.status)}</div><div class="layout-2"><div class="panel-stack"><div class="comp-inline-callout"><div class="comp-callout-icon">${I('scale',22)}</div><div><strong>Could this case go to the ODPC?</strong><p>If your personal data may have been misused and the concern remains unresolved, you can explore ODPC escalation and possible compensation where justified.</p></div>${Btn('See ODPC options','viewCompensation','outline sm')}</div><div class="next-action"><div class="eyebrow">NEXT ACTION</div><strong>${next[0]}</strong><p>${next[1]}</p>${Btn(`${next[0]} ${I('arrow')}`,next[2],'primary')}</div>${caseProgress(c)}<div class="card"><div class="topline"><h3>Case activity</h3>${Pill('Verified updates only in production','gray')}</div><div class="divider"></div><h3>Activity timeline</h3><div class="timeline">${c.events.map(e=>`<div class="event"><strong>${esc(e.title)}</strong><p>${esc(e.detail)}</p><time>${esc(e.when)}</time></div>`).join('')}</div></div><div class="card"><div class="topline"><h3>What's in your case</h3>${Pill(c.files.length+' file(s)','outline')}</div><div style="margin-top:13px">${c.files.length?c.files.map(f=>`<div class="link-row"><div style="display:flex;gap:10px;align-items:center">${I('file')}<div><strong>${esc(f)}</strong><p>Prototype file name only</p></div></div>${Pill('Private','gray')}</div>`).join(''):'<div class="empty"><strong>No attachment yet</strong><p>You can still save a draft, but evidence may be needed before a complaint.</p></div>'}</div></div></div><div class="panel-stack"><div class="card"><h3>Company information</h3><div class="result-list"><div class="result-line"><span>Reported brand</span><strong>${esc(c.company)}</strong></div><div class="result-line"><span>Sender ID</span><strong>${esc(c.sender||'Unknown')}</strong></div><div class="result-line"><span>Contact status</span><strong>${co&&co.verified?'Sample directory match':'Needs manual research'}</strong></div><div class="result-line"><span>Consent record</span><strong>${c.response==='consent'?'Claimed; review required':'Not established'}</strong></div></div>${Btn('View consent request','openConsent','outline full')}${c.response==='consent'?`<div style="height:9px"></div>${Btn('Compare consent evidence','openConsentReview','primary full')}`:''}</div><div class="card"><div class="icon-tile">${I('scale')}</div><h3 style="margin-top:10px">ODPC complaint &amp; possible compensation</h3><p>If your complaint supports a past privacy violation and qualifying damage, you may seek review and appropriate remedies. ODPC decides. Filing is free and not automatic.</p>${Btn('View ODPC preparation','openODPC','outline full')}</div><div class="notice">${I('info')} This is sample case information. No real company has been contacted.</div></div></div>`}
function stageOf(s){return s==='odpc'||s==='submitted'?4:s==='resolution'||s==='review'||s==='unresolved'||s==='pack'||s==='closed'?3:s==='waiting'||s==='contact'?2:1}
function consentPage(){let c=getCase(),co=getCompany(c.company),verified=!!(co&&co.verified),allowed=!!c.screened&&c.files.length>0&&verified&&state.contactAuth&& (state.consentAccess||state.consentObject);return `<div class="page-header"><div><div class="eyebrow">${I('shield')} COMPANY-FIRST WORKFLOW</div><h1>Ask about your data</h1><p>Choose what to request. We prepare the letter and only simulate sending it after your approval.</p></div>${Pill('Customer approval required','amber')}</div><div class="layout-2"><div class="panel-stack"><div class="card"><div class="topline"><h3>1. Choose a case</h3>${Pill('Private','gray')}</div><div class="field" style="margin-top:12px;margin-bottom:0"><label for="requestCase">Request relates to</label><select id="requestCase">${state.cases.map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${esc(x.id)} · ${esc(x.company)}</option>`).join('')}</select></div><div class="divider"></div><div class="topline"><h3>2. Company contact</h3>${verified?Pill('Fictional demo match','teal'):Pill('Verification required','amber')}</div><div class="result-list"><div class="result-line"><span>Brand</span><strong>${esc(c.company||'Unknown')}</strong></div><div class="result-line"><span>Legal entity</span><strong>${esc(co?co.legal:'Not verified')}</strong></div><div class="result-line"><span>Destination</span><strong>${esc(co&&co.contact?co.contact:'No verified address')}</strong></div></div>${!verified?`<div class="notice warn">${I('alert')} An officer must verify the company's identity and contact address before any notice can be sent.</div>${Btn('Go to company research','toCompanies','outline')}`:`<div class="notice success">${I('checkCircle')} Fictional directory match for demonstration only. In production, each contact requires independently recorded source verification.</div>`}</div><div class="card">${!c.screened?`<div class="notice warn">${I('alert')} Evidence screening is pending. Staff must confirm the available material is sufficient before a company notice is allowed.</div>`:""}<h3>3. What should we ask?</h3><label class="check"><input type="checkbox" id="askAccess" ${state.consentAccess?'checked':''}><span><b>Request information about my data</b><br>Ask where my number came from, the purpose, lawful basis and any consent record.</span></label><label class="check"><input type="checkbox" id="askObject" ${state.consentObject?'checked':''}><span><b>Object to direct marketing</b><br>Tell the company I do not want promotional messages.</span></label><div class="notice">${I('clock')} Data-access and direct-marketing objection requests have different statutory timelines. Deadlines start from the relevant service event.</div></div><div class="card"><h3>4. Review and authorise</h3><div class="review-preview">${esc(makeNotice(c))}</div><label class="check"><input id="contactAuthority" type="checkbox" ${state.contactAuth?'checked':''}><span>I authorise PrivacyGuard to prepare and, in a live service, send this specific request to the verified company contact. I understand this prototype does not send it.</span></label><div class="action-group">${Btn(`${I('copy')} Copy notice`,'copyNotice','outline')}${Btn(`${I('send')} Simulate sending request`,'sendNotice','primary',allowed?'':'disabled')}</div></div></div><aside class="panel-stack"><div class="side-note"><h3>Why we contact the company</h3><ul><li>Learn what lawful basis it says supports the marketing.</li><li>Request its actual consent evidence.</li><li>Give the company a chance to resolve the complaint.</li><li>Preserve an auditable correspondence history.</li></ul></div><div class="card flat"><h3>Never automatic</h3><div class="module" style="margin-top:12px">${I('lock')}<div><strong>Contact authorisation</strong><small>Company correspondence is a separate permission from ODPC filing.</small></div></div><div class="module">${I('user')}<div><strong>Disputed legal positions</strong><small>Human review before legal conclusions.</small></div></div><div class="module">${I('scale')}<div><strong>Regulatory escalation</strong><small>Consumer approves a separate filing step.</small></div></div></div></aside></div>`}
function makeNotice(c){return `Subject: Data access / direct marketing request — ${c.id}\n\nTo the privacy contact of ${c.company},\n\nI am requesting information on the source and use of my contact details in connection with promotional communications from sender ${c.sender||'[sender]'} .\n\n${state.consentAccess?'Please provide the applicable lawful basis, purposes, source, and any marketing consent records on which you rely.\n':''}${state.consentObject?'I also object to further direct marketing to my contact details. Please confirm how this objection will be implemented.\n':''}\nThis request is made on my behalf with specific authorisation.\n\nRegards,\nConsumer (details disclosed only as necessary)\n\nDRAFT TEMPLATE · Not sent from this prototype`}
function consentReviewPage(){let c=getCase();let claimed=c.response==='consent';return `<button class="txtbtn" data-action="openCase">${I('back')} Back to case</button><div class="page-header" style="margin-top:14px"><div><div class="eyebrow">${I('shield')} CONSENT VERIFICATION</div><h1>What did the company actually prove?</h1><p>${esc(c.id)} · ${esc(c.company)}. The company's claim is not the same as a validated consent record.</p></div>${Pill('Human review required','amber')}</div><div class="layout-2"><div class="panel-stack"><div class="card"><div class="topline"><h3>Compare what we know</h3>${Pill('Sample comparison','gray')}</div><div class="tablewrap" style="margin-top:17px"><table class="table"><thead><tr><th>Question</th><th>Your report</th><th>Company position</th></tr></thead><tbody><tr><td><strong>Prior relationship</strong></td><td>${esc(c.relation==='former'?'Previous customer':c.relation==='no'?'No':c.relation==='yes'?'Yes':'Not sure')}</td><td>${claimed?'Claims previous registration':'No records reviewed'}</td></tr><tr><td><strong>Marketing permission</strong></td><td>Not independently verified</td><td>${claimed?'Claims consent; source record unavailable in demo':'Not established'}</td></tr><tr><td><strong>Prior objection</strong></td><td>${esc(c.opted==='yes'?'User says yes':c.opted==='no'?'User says no':'Not sure')}</td><td>Full opt-out log not provided</td></tr><tr><td><strong>Proof of source / date</strong></td><td>Evidence in private case</td><td>Requires original attributable record</td></tr></tbody></table></div><div class="notice warn" style="margin-top:15px">${I('alert')} <p><b>Assessment: unresolved.</b> A statement like “the customer agreed to terms” does not, by itself, show the content, timing and purpose of a valid marketing permission. The actual documents and applicable lawful basis need review.</p></div></div><div class="card"><h3>Available next steps</h3><p>Ask for a clearer record or prepare the complaint for human-reviewed ODPC escalation. Neither option guarantees a legal finding.</p><div class="action-group">${Btn('Request clarification (demo)','requestClarification','outline')}${Btn('Explore ODPC route','openODPC','primary')}</div></div></div><div class="panel-stack"><div class="side-note"><h3>What a reviewer checks</h3><ul><li>Who collected the phone number?</li><li>What was the exact marketing consent wording?</li><li>What is the time, channel and attribution?</li><li>Was there a valid objection or withdrawal?</li><li>Are marketing agents or brokers involved?</li></ul></div><div class="card"><h3>Evidence hierarchy</h3><div class="module">${I('file')}<div><strong>Original company record</strong><small>Registration form or system audit event with verifiable context</small></div></div><div class="module">${I('message')}<div><strong>Consumer communications</strong><small>Marketing screenshots and any earlier opt-out</small></div></div><div class="module">${I('clipboard')}<div><strong>Reviewer decision</strong><small>Source-backed finding, not automatic AI liability detection</small></div></div></div></div></div>`}
function resolutionPage(){let c=getCase();return `<button class="txtbtn" data-action="openCase">${I('back')} Back to case</button><div class="page-header" style="margin-top:15px"><div><div class="eyebrow">${I('checkCircle')} CUSTOMER DECISION</div><h1>Is the issue resolved for you?</h1><p>Case ${esc(c.id)} · ${esc(c.company)}</p></div>${Pill('Awaiting your choice','teal')}</div><div class="wizard-layout"><div class="card wizard-card"><div class="notice success">${I('checkCircle')} <p><b>The company says it has stopped promotional messages.</b> That may address the immediate problem, but it does not necessarily resolve every concern about earlier use of your information.</p></div><h3 style="margin:22px 0 12px">What would you like to do?</h3><div class="radio-options"><label class="choice"><input type="radio" name="resolution" value="close" checked><span><b>I'm satisfied. Close my case.</b><small>Record my decision and keep an appropriate case history.</small></span></label><label class="choice"><input type="radio" name="resolution" value="review"><span><b>Review a past violation for ODPC &amp; possible compensation.</b><small>I want to check whether past marketing merits an ODPC complaint even if it has now stopped. Compensation is not guaranteed.</small></span></label><label class="choice"><input type="radio" name="resolution" value="continues"><span><b>The messages haven't stopped.</b><small>I may have new messages or another unresolved concern.</small></span></label></div><div class="notice" style="margin-top:17px">${I('info')} Closing your PrivacyGuard case does not, by itself, establish a legal settlement or waive your rights.</div><div class="wizard-actions">${Btn(`${I('back')} Back`,'openCase','outline')}${Btn(`Confirm my choice ${I('arrow')}`,'confirmResolution','primary')}</div></div><div class="wizard-side"><div class="side-note"><h3>What we won't do</h3><ul><li>Automatically close a case because a company says it complied.</li><li>Promise compensation for prior messages.</li><li>Accept settlements on your behalf.</li><li>Send an ODPC complaint without explicit authority.</li></ul></div></div></div>`}
function odpcPage(){let c=getCase();let needed=[['Evidence available and reviewed',c.files.length>0&&!!c.screened],['Company identity established',!!getCompany(c.company)],['Case chronology prepared',c.events.length>0],['Consumer ODPC authority',state.odpcAuth]];let ready=needed.every(x=>x[1]);return `<button class="txtbtn" data-action="openCase">${I('back')} Back to case</button><div class="page-header" style="margin-top:15px"><div><div class="eyebrow">${I('scale')} REGULATORY PATHWAY</div><h1>ODPC complaint &amp; potential compensation</h1><p>Individual case ${esc(c.id)}. Company-first contact is our default, but not a universal legal prerequisite.</p></div>${Pill('Human-assisted filing','amber')}</div><div class="layout-2"><div class="panel-stack"><div class="card"><div class="comp-outcome"><strong>${I('scale',18)} What may happen at the ODPC?</strong><p>ODPC may reject or dismiss the complaint, find a violation, require corrective action or order compensation when legally justified. A compensation award is not a payment per spam message, and any decision may be appealed.</p></div><div class="topline"><h3>Submission checklist</h3>${Pill(needed.filter(x=>x[1]).length+'/'+needed.length+' complete','gray')}</div><div style="margin-top:15px">${needed.map(([t,done])=>`<div class="link-row"><div style="display:flex;align-items:center;gap:10px">${I(done?'checkCircle':'clock',18)} <strong>${t}</strong></div>${Pill(done?'Ready':'Needs action',done?'teal':'amber')}</div>`).join('')}</div><label class="check"><input type="checkbox" id="odpcAuthority" ${state.odpcAuth?'checked':''}><span>I request preparation of an ODPC complaint pack for this specific case. Before actual filing, I must review the final pack, confirm my statements, and separately authorise filing by an accepted channel.</span></label><div class="action-group">${Btn(`${I('file')} Prepare demo complaint pack`,'preparePack','primary',ready?'':'disabled')}${Btn('Official ODPC portal','openPortal','outline')}</div></div><div class="card"><h3>What harm or impact would you like reviewed?</h3><p class="small muted">Your account helps explain the concern; it does not establish entitlement to compensation.</p><div class="field" style="margin:13px 0"><label for="impactType">Type of impact (if any)</label><select id="impactType"><option value="not_provided" ${!c.impact||c.impact==='not_provided'?'selected':''}>I have not described an impact yet</option><option value="distress" ${c.impact==='distress'?'selected':''}>Distress or anxiety from repeated contact</option><option value="financial" ${c.impact==='financial'?'selected':''}>Financial loss I can explain</option><option value="continued" ${c.impact==='continued'?'selected':''}>Marketing continued after my objection</option><option value="other" ${c.impact==='other'?'selected':''}>Other privacy impact</option></select></div>${Btn('Save impact for human review','saveImpact','outline')}</div><div class="card"><h3>What happens after a real submission?</h3><div class="timeline"><div class="event"><strong>Submitted to ODPC</strong><p>Record the actual filing receipt; do not invent a reference.</p></div><div class="event"><strong>ODPC acknowledges</strong><p>Enter the regulator-issued reference after verification.</p></div><div class="event"><strong>ODPC handles the complaint</strong><p>Respond to requests for evidence and update the consumer.</p></div><div class="event"><strong>ODPC determination</strong><p>Outcome may include dismissal, corrective action or a compensation order where warranted.</p></div><div class="event"><strong>Compensation / appeal tracked separately</strong><p>An award may be challenged and does not prove that money has been received.</p></div></div></div></div><div class="panel-stack"><div class="side-note"><div class="icon-tile teal">${I('scale')}</div><h3 style="margin-top:12px">ODPC filing is free</h3><p class="small muted" style="margin-top:8px">PrivacyGuard is an independent support service, not the ODPC. We do not guarantee that a complaint will be upheld or that compensation will be awarded.</p></div><div class="card flat"><h3>Official resources</h3><div class="link-row"><a href="https://cie.odpc.go.ke/Complaint" target="_blank" rel="noopener noreferrer">ODPC complaint portal ${I('link',13)}</a></div><div class="link-row"><a href="https://www.odpc.go.ke/c-i-e/" target="_blank" rel="noopener noreferrer">Complaints Directorate & forms ${I('link',13)}</a></div><div class="link-row"><a href="https://www.odpc.go.ke/determinations/" target="_blank" rel="noopener noreferrer">Published decisions ${I('link',13)}</a></div></div></div></div>`}
function compensationPage(){let c=getCase();return `<button class="txtbtn" data-action="openCase">${I('back')} Back to my case</button><div class="page-header" style="margin-top:15px"><div><div class="eyebrow">${I('scale')} YOUR RIGHTS · ODPC</div><h1>Can I take this to ODPC and seek compensation?</h1><p>Kenya's ODPC receives complaints about misuse of personal data. A complaint can be considered even if a company later stops the marketing, but compensation is never automatic.</p></div>${Pill('Information, not a legal ruling','amber')}</div><div class="comp-explainer-hero"><div class="icon-tile amber">${I('scale',23)}</div><div><h3>ODPC makes the decision — not PrivacyGuard</h3><p>We help you document messages, consent and opt-outs, prepare correspondence and explore a properly authorised ODPC complaint. Compensation is determined case by case where the law and evidence justify it.</p></div></div><div class="tiles-3 comp-steps" style="margin-top:19px"><div class="card"><span class="pill gray">1 · Evidence</span><h3 style="margin-top:11px">What messages did you receive?</h3><p>Preserve screenshots, dates, sender details and evidence of previous opt-outs. An SMS alone does not prove unlawfulness.</p></div><div class="card"><span class="pill gray">2 · Company position</span><h3 style="margin-top:11px">What does the company say?</h3><p>We can request the source of your number and the records of consent or other lawful basis it relies on.</p></div><div class="card"><span class="pill teal">3 · ODPC review</span><h3 style="margin-top:11px">What remedy is appropriate?</h3><p>ODPC considers the complaint. Outcomes may include dismissal, corrective action or compensation if the necessary conditions are met.</p></div></div><div class="layout-2" style="margin-top:20px"><div class="panel-stack"><div class="card"><h3>What might support a compensation request?</h3><div class="timeline"><div class="event"><strong>A potentially unlawful use of personal data</strong><p>Assess consent records, marketing purpose, previous objections and sender attribution.</p></div><div class="event"><strong>Specific impact or damage</strong><p>Explain any financial loss, distress or other qualifying non-financial harm and provide available supporting material.</p></div><div class="event"><strong>A causal connection</strong><p>Explain how the alleged contravention led to the claimed damage. This is reviewed on the facts.</p></div></div><div class="notice warn">${I('alert')} There is no fixed payment per message. Outcomes can be appealed. PrivacyGuard cannot say you qualify for compensation based on a screenshot alone.</div><div class="action-group">${Btn('Prepare ODPC pathway for this case','openODPC','primary')}${Btn('Continue gathering evidence','openConsent','outline')}</div></div></div><div class="panel-stack"><div class="card"><h3>Your current case</h3><div class="result-list"><div class="result-line"><span>Case</span><strong>${esc(c.id)}</strong></div><div class="result-line"><span>Company</span><strong>${esc(c.company)}</strong></div><div class="result-line"><span>Current stage</span><strong>${esc(labelStatus(c.status)[0])}</strong></div><div class="result-line"><span>ODPC reference</span><strong>${esc(c.odpcRef||'Not filed/acknowledged')}</strong></div></div><div class="notice">${I('info')} PrivacyGuard will not file a complaint or represent you without separately documented authority. Filing with ODPC yourself is free.</div></div><div class="card flat"><h3>Official ODPC sources</h3><div class="link-row"><a href="https://www.odpc.go.ke/file-a-complaint/" target="_blank" rel="noopener noreferrer">How to file a complaint ${I('link',13)}</a></div><div class="link-row"><a href="https://cie.odpc.go.ke/Complaint" target="_blank" rel="noopener noreferrer">Official online complaint portal ${I('link',13)}</a></div><div class="link-row"><a href="https://www.odpc.go.ke/determinations/" target="_blank" rel="noopener noreferrer">Published ODPC decisions ${I('link',13)}</a></div></div></div></div>`}
function helpPage(){return `<div class="page-header"><div><div class="eyebrow">${I('help')} SIMPLE GUIDANCE</div><h1>ODPC complaints, privacy rights &amp; compensation</h1><p>Know when you can report a privacy concern to Kenya’s ODPC and what remedies may be available.</p></div></div><div class="layout-2"><div class="panel-stack">${[['Can I object to marketing?','You can object to the use of your data for direct marketing. Previous permission does not necessarily mean a company can keep marketing after a valid objection.'],['Must I contact the company first?','No. It is often useful to seek an explanation first, but ODPC complaints do not universally require a company-first step.'],['What if the company stops?','You decide whether you are satisfied. Corrective action may resolve the immediate issue without necessarily settling questions about the past.'],['Could I seek compensation through ODPC?','Potentially. The relevant violation, damage (including qualifying distress) and supporting evidence matter. The ODPC makes its own determination; no compensation is automatic.'],['Do I need to join a group?','No. This version supports individual private cases only. Group claims are intentionally postponed.'],['Is filing with ODPC free?','Yes. Official ODPC complaint filing is free. Optional PrivacyGuard administrative assistance is separate.']].map(([q,a])=>`<details class="card flat" style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:760">${q}</summary><p class="small muted" style="margin:12px 0 0">${a}</p></details>`).join('')}</div><div class="panel-stack"><div class="card"><h3>Helpful official links</h3><div class="link-row"><a href="https://www.odpc.go.ke/file-a-complaint/" target="_blank" rel="noopener noreferrer">File a complaint</a>${I('arrow')}</div><div class="link-row"><a href="https://www.odpc.go.ke/data-protection-laws-kenya/" target="_blank" rel="noopener noreferrer">Data protection laws</a>${I('arrow')}</div><div class="link-row"><a href="https://www.odpc.go.ke/determinations/" target="_blank" rel="noopener noreferrer">Published ODPC decisions</a>${I('arrow')}</div></div><div class="side-note"><h3>Privacy promise</h3><p class="small muted" style="margin-top:9px">This prototype does not connect to storage, OTP, email, AI, M-Pesa or a regulator. In the real product, private evidence and user authority must be secured and independently audited.</p></div></div></div>`}
function opsOverview(){let review=state.cases.filter(c=>['resolution','review','unresolved','verify'].includes(c.status)).length;return `<div class="page-header"><div><div class="eyebrow">${I('zap')} OPERATIONS COMMAND CENTRE</div><h1>Good afternoon, operations.</h1><p>Watch exceptions, not every routine case. All numbers on this page are fictional demonstration values.</p></div>${Pill('Demo mode · no live queues','teal')}</div><div class="tiles-4"><div class="stat-card"><div class="stat-label">Cases in workspace</div><div class="stat-num">${state.cases.length}</div><div class="stat-note">Simulated case records</div></div><div class="stat-card"><div class="stat-label">Require human review</div><div class="stat-num">${review}</div><div class="stat-note">Consent or customer decision</div></div><div class="stat-card"><div class="stat-label">Unverified contacts</div><div class="stat-num">${state.companies.filter(c=>!c.verified).length}</div><div class="stat-note">Do not send yet</div></div><div class="stat-card"><div class="stat-label">ODPC-tracked</div><div class="stat-num">${state.cases.filter(c=>['odpc','submitted'].includes(c.status)).length}</div><div class="stat-note">Verify official updates</div></div></div><div style="margin-top:21px">${overallPipeline()}</div><div class="layout-2" style="margin-top:22px"><div class="panel-stack"><div class="card"><div class="topline"><h3>Priority actions</h3><button class="txtbtn" data-nav="queue">Open queue ${I('arrow',15)}</button></div>${renderPriority()}</div><div class="card"><div class="topline"><h3>Recent email & ODPC activity</h3><button class="txtbtn" data-nav="inbox">Full log ${I('arrow',14)}</button></div>${state.communications.slice(-4).reverse().map(c=>commRow(c,false)).join('')}</div><div class="card"><div class="topline"><h3>Workflow throughput</h3>${Pill('Illustrative only','outline')}</div><p class="small muted">Example volume pattern for dashboard design, not actual performance.</p><div class="mini-bars">${[41,66,59,85,74,94,67].map(h=>`<span style="height:${h}%"></span>`).join('')}</div><div class="bar-axis">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(a=>`<b>${a}</b>`).join('')}</div></div></div><div class="panel-stack"><div class="card"><div class="topline"><h3>Automation health</h3>${Pill('Design status','gray')}</div>${[['Evidence intake','Auto · guarded'],['Company contact verification','Human checkpoint'],['Notice generation','Auto after authority'],['Delivery & deadlines','Queue-driven'],['Reply classification','Assisted · reviewed'],['ODPC portal submission','Manual / approved integration']].map(([n,s])=>`<div class="link-row"><strong>${n}</strong><span class="tiny muted text-right">${s}</span></div>`).join('')}</div><div class="notice warn">${I('alert')} Always keep separate timelines for data access, objection and regulator correspondence. Do not auto-submit to ODPC or assume a contact email is verified.</div><div class="card flat"><h3>What needs a person?</h3><p>Identity uncertainty, missing company contacts, disputed consent, settlement proposals, official filing, and determination interpretation.</p>${Btn('Open the review queue','toQueue','outline full')}</div></div></div>`}
function renderPriority(){const arr=[['Unknown sender alias','SAVEX requires responsible company research','Company verification','toCompanies'],['Company response received','PG-1042 · consumer must decide what happens next','Consumer decision','goCase1042'],['Consent disputed','PG-1017 · review company assertions before action','Legal / policy review','goCase1017'],['ODPC case correspondence','Verify any official request and record reference','ODPC tracking','toODPCOps']];return arr.map(([h,p,status,act],i)=>`<div class="queue-row"><div class="qa">${I(['search','message','shield','scale'][i])}</div><div><strong>${h}</strong><p>${p}</p><div style="margin-top:7px">${Pill(status,i===0?'amber':'gray')}</div></div><button class="button outline sm" data-action="${act}">Review ${I('arrow',14)}</button></div>`).join('')}
function opsQueue(){let tabs=[['all','All exceptions'],['company','Company verification'],['reply','Replies'],['odpc','ODPC']];return `<div class="page-header"><div><div class="eyebrow">${I('clipboard')} TRIAGE & ESCALATION</div><h1>Review queue</h1><p>Human attention is reserved for ambiguity, sensitive decisions and failed automation.</p></div></div><div class="card"><div class="filters">${tabs.map(([v,n])=>`<button class="filter ${state.queueFilter===v?'active':''}" data-qfilter="${v}">${n}</button>`).join('')}</div>${state.queueFilter==='all'||state.queueFilter==='company'?`<div class="queue-row"><div class="qa">${I('search')}</div><div><strong>Identify responsible company: SAVEX</strong><p>Unknown sender ID. No notice can go out before verified attribution and contact.</p>${Pill('Human verification','amber')}</div><button class="button outline sm" data-nav="companies">Research</button></div>`:''}${state.queueFilter==='all'||state.queueFilter==='reply'?state.cases.filter(c=>['resolution','review','unresolved'].includes(c.status)).map(c=>`<div class="queue-row"><div class="qa">${I('mail')}</div><div><strong>${esc(c.id)} · ${esc(c.company)}</strong><p>${c.status==='resolution'?'Company says marketing has stopped; customer resolution decision needed.':'Consent/evidence review is required before escalation.'}</p>${Status(c.status)}</div><button class="button outline sm" data-ops-case="${esc(c.id)}">Open case</button></div>`).join(''):''}${state.queueFilter==='all'||state.queueFilter==='odpc'?state.cases.filter(c=>['odpc','submitted','pack'].includes(c.status)).map(c=>`<div class="queue-row"><div class="qa">${I('scale')}</div><div><strong>${esc(c.id)} · ODPC status</strong><p>${esc(c.odpcRef||'Awaiting actual official filing receipt / acknowledgement')}</p>${Status(c.status)}</div><button class="button outline sm" data-nav="odpcops">Track</button></div>`).join(''):''}</div><div class="notice" style="margin-top:15px">${I('lock')} No customer data may be displayed to another consumer. Operator access in a production system must be limited to authorised, assigned work.</div>`}
function opsCompanies(){let comps=state.companies.filter(c=>[c.brand,c.legal,c.sender].join(' ').toLowerCase().includes(state.opsSearch.toLowerCase()));return `<div class="page-header"><div><div class="eyebrow">${I('building')} VERIFIED CONTACT DIRECTORY</div><h1>Company research</h1><p>Sender aliases are not proof of legal identity. Review sources and approve each new contact.</p></div>${Btn(`${I('plus')} Add sample company`,'addCompany','outline')}</div><div class="card"><div class="field"><label for="companySearch">Find a company, brand, or sender ID</label><input id="companySearch" placeholder="Search directory..." value="${esc(state.opsSearch)}"></div><div class="tablewrap"><table class="table"><thead><tr><th>Brand / sender</th><th>Legal entity</th><th>Contact</th><th>Verification</th><th>Action</th></tr></thead><tbody>${comps.map((c,i)=>`<tr><td><strong>${esc(c.brand)}</strong><small>${esc(c.sender)}</small></td><td>${esc(c.legal)}</td><td>${c.contact?esc(c.contact):'<span class="muted">Not found</span>'}</td><td>${Pill(c.verified?'Sample match':'Research needed',c.verified?'teal':'amber')}</td><td><button class="txtbtn" data-company-index="${state.companies.indexOf(c)}">${c.verified?'Inspect':'Research'} ${I('chevron',13)}</button></td></tr>`).join('')}</tbody></table></div>${comps.length?'':'<div class="empty"><strong>No company matches</strong><p>Try a different brand or sender.</p></div>'}</div><div class="notice warn" style="margin-top:15px">${I('alert')} The listed organisations, legal entities and .invalid email addresses are fictional. In production, source evidence, independent domain verification and a reviewer approval are mandatory.</div>`}
function opsCase(){let c=getCase();return `<button class="txtbtn" data-nav="queue">${I('back')} Back to review queue</button><div class="page-header" style="margin-top:14px"><div><div class="eyebrow">${I('user')} RESTRICTED OPERATOR VIEW</div><h1>${esc(c.id)} · ${esc(c.company)}</h1><p>Review case evidence and company communication. Do not infer legal liability automatically.</p></div>${Status(c.status)}</div><div style="margin-bottom:17px">${caseProgress(c)}</div><div class="layout-2"><div class="panel-stack"><div class="card"><h3>Response management (demo)</h3><p>Choose a simulated company response to see how it affects the consumer's next step. No real correspondence occurs.</p><div class="field" style="margin-top:15px"><label for="replyKind">Classify company response</label><select id="replyKind"><option value="stopped">Company says marketing stopped</option><option value="consent">Company claims prior marketing consent</option><option value="unclear">Incomplete or unclear response</option><option value="continues">Marketing continues after objection</option><option value="settlement">Company proposes a settlement</option></select></div>${Btn(`${I('clipboard')} Record demo response`,'recordResponse','primary')}<div class="divider"></div><h3>Email & regulator correspondence</h3><p>Outgoing and incoming communications for this case, including ODPC messages where applicable.</p>${state.communications.filter(m=>m.caseId===c.id).slice().reverse().map(m=>commRow(m,false)).join('')||'<p class="muted small">No messages recorded for this case.</p>'}${state.communications.some(m=>m.caseId===c.id&&m.audience==='odpc'&&m.status==='action')?`<div style="margin-top:12px">${Btn('Record demo response to ODPC','simulateOdpcReply','outline')}</div>`:''}<div class="divider"></div><h3>Case activity timeline</h3><div class="timeline">${c.events.map(e=>`<div class="event"><strong>${esc(e.title)}</strong><p>${esc(e.detail)}</p><time>${esc(e.when)}</time></div>`).join('')}</div></div></div><div class="panel-stack"><div class="card"><div class="topline"><h3>Evidence integrity screening</h3>${Pill('Review required','amber')}</div><p class="small muted">A verified phone number is not proof that the claimed message is authentic. These are prototype checklist prompts, not automatic fraud findings.</p><div class="result-list"><div class="result-line"><span>Phone ownership</span><strong>OTP check required</strong></div><div class="result-line"><span>Original message / export</span><strong>Not independently confirmed</strong></div><div class="result-line"><span>Duplicate case detection</span><strong>Compare evidence fingerprints</strong></div><div class="result-line"><span>Sender attribution</span><strong>Verify legal entity separately</strong></div><div class="result-line"><span>Evidence chronology</span><strong>Review dates &amp; prior opt-out</strong></div></div><div class="notice">${I('info')} Flag unusual records for human verification; do not accuse consumers of fraud based solely on a model score or screenshot metadata.</div><div class="action-group">${Btn('Approve screening (demo)','approveScreening','primary',c.screened?'disabled':'')}${Btn('Flag for recheck','flagScreening','outline')}</div><p class="small muted" style="margin-top:10px">Current evidence checkpoint: ${c.screened?'Approved in prototype':'Not yet approved'}. Approval is only a fictional demonstration and does not establish authenticity.</p></div><div class="card"><h3>Case summary &amp; remedy review</h3><div class="result-list"><div class="result-line"><span>Goal</span><strong>${esc(goalText(c.goal))}</strong></div><div class="result-line"><span>Reported sender</span><strong>${esc(c.sender)}</strong></div><div class="result-line"><span>Prior objection</span><strong>${esc(c.opted)}</strong></div><div class="result-line"><span>Attachments</span><strong>${c.files.length}</strong></div><div class="result-line"><span>Claimed impact</span><strong>${esc(c.impact||'Not recorded')}</strong></div><div class="result-line"><span>Compensation status</span><strong>Not determined</strong></div></div></div><div class="notice warn">${I('alert')} A possible compensation claim is not a compensation award. Consent claims, settlement terms and legal escalation must be reviewed by an authorised person. A model-generated assessment is not an ODPC finding.</div>${Btn('Go to ODPC tracking','toODPCOps','outline full')}</div></div>`}
function opsODPC(){return `<div class="page-header"><div><div class="eyebrow">${I('scale')} REGULATOR CASE MANAGEMENT</div><h1>ODPC tracking</h1><p>Separate portal submission from actual acknowledgement, regulator decisions, appeals and payments received.</p></div>${Pill('Manual filing in MVP','amber')}</div><div class="tiles-3"><div class="stat-card"><div class="stat-label">Packs prepared</div><div class="stat-num">${state.cases.filter(c=>c.status==='pack').length}</div><div class="stat-note">Not yet official submissions</div></div><div class="stat-card"><div class="stat-label">Filed · awaiting acknowledgement</div><div class="stat-num">${state.cases.filter(c=>c.status==='submitted').length}</div><div class="stat-note">Recorded submission only</div></div><div class="stat-card"><div class="stat-label">Acknowledged demo cases</div><div class="stat-num">${state.cases.filter(c=>c.status==='odpc').length}</div><div class="stat-note">Illustrative official references</div></div></div><div class="card" style="margin-top:18px"><h3>ODPC case register</h3><div class="tablewrap" style="margin-top:15px"><table class="table"><thead><tr><th>Case</th><th>Company</th><th>Official reference</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.cases.filter(c=>['pack','submitted','odpc'].includes(c.status)).map(c=>`<tr><td><strong>${esc(c.id)}</strong></td><td>${esc(c.company)}</td><td>${esc(c.odpcRef||'Not provided')}</td><td>${Status(c.status)}</td><td><button class="txtbtn" data-odpc-record="${esc(c.id)}">${c.status==='pack'?'Record submission':c.status==='submitted'?'Record acknowledgement':'Inspect'} ${I('chevron',13)}</button></td></tr>`).join('')||'<tr><td colspan="5">No demo regulator cases yet.</td></tr>'}</tbody></table></div></div><div class="card" style="margin-top:18px"><div class="topline"><h3>ODPC email / portal activity</h3><button class="txtbtn" data-nav="inbox">View full inbox ${I('arrow',13)}</button></div><p class="small muted">Sent and received demo records. Never infer a decision from a generic acknowledgement.</p>${state.communications.filter(m=>m.audience==='odpc').slice().reverse().map(m=>commRow(m)).join('')}</div><div class="notice" style="margin-top:14px">${I('info')} No live ODPC filing or status API is used by this prototype. An operator must verify real receipts and reference numbers before changing an actual case's official status.</div>`}
function opsSettings(){let rules=[['Data access request','7 days','From relevant request/service, subject to verified legal rule'],['Direct marketing objection','14 days','Rights request clock — separate from access'],['ODPC acknowledgement','Published service standard','Check applicable working-day definition'],['ODPC investigation','Statutory 90-day standard','Not a guaranteed closure date']];return `<div class="page-header"><div><div class="eyebrow">${I('settings')} CONTROLS & GOVERNANCE</div><h1>Automation settings</h1><p>Safe defaults: automate administration, require humans for exceptions and formal decisions.</p></div>${Pill('Design-only settings','gray')}</div><div class="layout-2"><div class="panel-stack"><div class="card"><h3>Automation boundaries</h3>${[['Automatically create private case drafts','Enabled by design'],['Send letters to unverified companies','Blocked'],['Contact a company without consumer authority','Blocked'],['Classify email replies into review categories','Assisted / human review'],['Auto-file official ODPC complaints','Blocked'],['Automatically close on a company promise','Blocked'],['Automatically accept settlement','Blocked']].map(([t,s])=>`<div class="link-row"><strong>${t}</strong>${Pill(s,s.includes('Blocked')?'red':s.includes('Enabled')?'teal':'gray')}</div>`).join('')}</div><div class="card"><h3>Legal time rules (configuration draft)</h3><div class="tablewrap" style="margin-top:15px"><table class="table"><thead><tr><th>Obligation</th><th>Period</th><th>Start event / caution</th></tr></thead><tbody>${rules.map(([a,b,c])=>`<tr><td><strong>${a}</strong></td><td>${b}</td><td>${c}</td></tr>`).join('')}</tbody></table></div><p class="footnote" style="margin-top:12px">Production rules must be approved by Kenyan counsel and versioned with the applicable legal source and trigger time.</p></div></div><div class="panel-stack"><div class="card"><h3>Required safeguards</h3>${[['Data protection impact review','Before real evidence'],['RLS and
