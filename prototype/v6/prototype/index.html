restricted staff access','Before real accounts'],['Cross-border storage assessment','Before Cloudflare R2'],['Mail delivery authentication and retries','Before automatic notices'],['Backups and restore tests','Before launch'],['Legal review of paid services','Before charging consumers']].map(([t,s])=>`<div class="link-row"><strong>${t}</strong><span class="tiny muted">${s}</span></div>`).join('')}</div><div class="side-note"><h3>Out of scope for v1</h3><p class="small muted" style="margin-top:8px">Group lawsuits, payout predictions, automatic ODPC web-form scraping, national ID collection at first report, inbox scanning and automatic acceptance of legal settlements.</p></div></div></div>`}
function renderModal(){let r=document.getElementById('modal-root');if(!state.modal){r.innerHTML='';return}let m=state.modal,content='';if(m==='guide')content=`<div class="modal-header"><h2>PrivacyGuard safeguards</h2><button class="iconbtn" data-action="closeModal">${I('x')}</button></div><div class="module">${I('lock')}<div><strong>Individual-first and private</strong><small>No group participation or publication of allegations.</small></div></div><div class="module">${I('user')}<div><strong>Explicit authorisations</strong><small>Separate company contact, ODPC filing and any settlements.</small></div></div><div class="module">${I('shield')}<div><strong>Human legal checkpoints</strong><small>Consent disputes, unverified identities and settlements need review.</small></div></div><div class="module">${I('info')}<div><strong>This demo is local</strong><small>It does not preserve your information after refresh or send any evidence.</small></div></div>${Btn('Understood','closeModal','primary full')}`;else if(m==='alerts')content=`<div class="modal-header"><h2>Updates</h2><button class="iconbtn" data-action="closeModal">${I('x')}</button></div><div class="module">${I('bell')}<div><strong>Case PG-1042</strong><small>The company has responded. Your decision is required before closure.</small></div></div><div class="module">${I('clipboard')}<div><strong>Operations example</strong><small>Unknown sender SAVEX requires manual company verification.</small></div></div><p class="footnote" style="margin-top:15px">These are fictional sample notifications.</p>${Btn('Close','closeModal','outline full')}`;else if(m==='company'){let co=state.companies[state.noticeCase]||state.companies[0];content=`<div class="modal-header"><h2>Company contact review</h2><button class="iconbtn" data-action="closeModal">${I('x')}</button></div><p class="small muted">All company entries are fictional. This demonstrates a required human verification checkpoint, not a real verified directory.</p><div class="r select id="milestone"><option value="submitted">Submission receipt received (unacknowledged)</option><option value="odpc">Formal ODPC acknowledgement verified</option></select></div><div class="field"><label>Receipt or reference code (demo)</label><input id="refCode" placeholder="Enter DEMO-... for prototype" value="${esc(c.odpcRef)}"><small>Use a fictional reference only. This does not contact ODPC.</small></div><div class="field"><label>Supporting note</label><textarea id="odpcNote" placeholder="Describe where the receipt was verified"></textarea></div><div class="action-group">${Btn('Cancel','closeModal','outline')}${Btn('Save demo milestone','saveMilestone','primary')}</div>`}else if(m==='how')content=`<div class="modal-header"><h2>How PrivacyGuard works</h2><button class="iconbtn" data-action="closeModal">${I('x')}</button></div><div class="timeline"><div class="event"><strong>Record the marketing message</strong><p>Tell us what arrived and attach evidence if available.</p></div><div class="event"><strong>Verify the responsible business</strong><p>Matching sender IDs to companies is an evidence-based process.</p></div><div class="event"><strong>Ask the company</strong><p>Only with your approval; different rights have different deadlines.</p></div><div class="event"><strong>Decide what happens next</strong><p>Close if satisfied or seek an ODPC route where justified.</p></div></div>${Btn('Start a report','startReport','primary full')}`;r.innerHTML=`<div class="modal-overlay" data-overlay="true"><div class="modal" role="dialog" aria-modal="true" aria-label="PrivacyGuard dialog">${content}</div></div>`;}

;return;case 'goCase1042':state.caseId='PG-1042';setView('opsCase','operations');return;case 'goCase1017':state.caseId='PG-1017';setView('opsCase','operations');return;case 'reopenCase':c.status='review';addEvent(c,'Case reopened in prototype','Consumer reopened a previously closed example.');toast('Demo case reopened.');render();return;case 'copyNotice':copyNotice();return;case 'sendNotice':{state.contactAuth=!!document.getElementById('contactAuthority')?.checked;state.consentAccess=!!document.getElementById('askAccess')?.checked;state.consentObject=!!document.getElementById('askObject')?.checked;let co=getCompany(c.company);if(!c.screened||!c.files.length||!state.contactAuth||!co?.verified||(!state.consentAccess&&!state.consentObject)){toast('Evidence screening, verified recipient, request type and authorisation are all required.');render(false);return}c.status='waiting';addEvent(c,'Company notice sent (DEMO ONLY)',`${state.consentAccess?'Data access request. ':''}${state.consentObject?'Direct marketing objection. ':''}No real email was sent.`);state.communications.unshift({id:'DEMO-'+Date.now(),caseId:c.id,audience:'company',direction:'out',title:'Company notice recorded (demo)',detail:'Company request simulation; no email sent',contact:co.contact,date:today,status:'sent',verified:false});toast('Notice simulated; no email was sent.');state.contactAuth=false;setView('detail','consumer');return;}case 'confirmResolution':{let value=document.querySelector('input[name="resolution"]:checked')?.value||'close';if(value==='close'){c.status='closed';addEvent(c,'Customer chose to close the case','Consumer confirmed satisfaction in the demonstration.');toast('Demo case closed at your request.')}else if(value==='review'){c.status='review';addEvent(c,'Review of past conduct requested','Consumer requested review of past data use, potential ODPC filing and remedies; no compensation established.');toast('Case marked for manual review.')}else{c.status='unresolved';addEvent(c,'Consumer reports that marketing continued','Additional evidence and review are needed.');toast('Case reopened for additional review.')}setView('detail','consumer');return;}case 'preparePack':state.odpcAuth=!!document.getElementById('odpcAuthority')?.checked;if(!state.odpcAuth||!c.files.length||!getCompany(c.company)){toast('Complete the checklist and approve preparation first.');render(false);return}c.status='pack';addEvent(c,'ODPC complaint pack prepared (DEMO ONLY)','No official filing occurred. Fresh filing approval, identity checks, a regulator-approved submission method and human/legal review where necessary are still required.');toast('Example complaint pack marked ready — not filed with ODPC.');setView('detail','consumer');return;case 'openPortal':window.open('https://cie.odpc.go.ke/Complaint','_blank','noopener,noreferrer');return;case 'simulateOdpcReply':{let pending=state.communications.find(m=>m.caseId===c.id&&m.audience==='odpc'&&m.status==='action');if(!pending){toast('No outstanding sample ODPC request.');return}pending.status='received';pending.detail+=' · Sample response recorded';state.communications.unshift({id:'DEMO-'+Date.now(),caseId:c.id,audience:'odpc',direction:'out',title:'Response to ODPC request recorded (demo)',detail:'No real email transmitted',contact:'ODPC correspondence · example',date:today,status:'sent',verified:false});addEvent(c,'ODPC response recorded (DEMO ONLY)','Nothing was sent.');toast('Demo follow-up logged; nothing sent.');render();return;}case 'recordResponse':{let v=document.getElementById('replyKind')?.value||'unclear';c.response=v;c.status=v==='stopped'?'resolution':'review';addEvent(c,'Company response recorded (DEMO ONLY)',({stopped:'Company says marketing stopped; requires consumer decision.',consent:'Company claims earlier consent; needs human review.',unclear:'Company response requires clarification.',continues:'Marketing reportedly continues; additional proof required.',settlement:'Settlement proposal; qualified revi ='odpc'?'ODPC acknowledgement recorded (demo)':'ODPC filing receipt recorded (demo)',detail:note,contact:'ODPC correspondence · example',date:today,status:stage==='odpc'?'acknowledged':'submitted',verified:false});state.modal=null;toast('Sample milestone saved. No official regulator record changed.');render();return;}default:toast('This is a design prototype only.');}}

homePage=function(){let h=oldHomePageV6();return h.replace('<div class="section-head"><h2>One report. Three possible outcomes.',`<div class="v6-truststrip"><span>${I('checkCircle',14)} Review first</span><span>${I('lock',14)} No ID photos collected</span><span>${I('scale',14)} ODPC filing available</span></div><div class="section-head"><h2>One report. Three possible outcomes.`);};
function privacyPageV6(){let c=getCase();return `<div class="page-header"><div><div class="eyebrow">${I('lock')} PRIVACY BY DESIGN</div><h1>What we collect — and what we don't</h1><p>Everything stays tied to your individual case. PrivacyGuard only asks for permissions as they're needed.</p></div>${Pill('No ID storage','teal')}</div><div class="v6-columns"><div class="panel-stack"><div class="v6-highlight"><div class="icon-tile teal">${I('shield',22)}</div><div><h3>Your National ID stays with ODPC</h3><p>If you choose formal filing, you provide ID details and images directly on ODPC's official website. They never pass through this prototype or PrivacyGuard's proposed normal workflow.</p></div></div><div class="v6-card"><h3>Three separate decisions</h3><p>These permissions should be collected when relevant, not bundled into one blanket checkbox.</p><div class="v6-permission"><div class="v6-badge">1</div><div><strong>Evidence and case processing</strong><p>We organise the messages and information you chose to share. We apply privacy and security protections even where another lawful basis is used.</p><div style="margin-top:7px">${Pill(state.dataProcessingApproved?'Approved in this demo':'Requested when creating a report',state.dataProcessingApproved?'teal':'gray')}</div></div></div><div class="v6-permission"><div class="v6-badge">2</div><div><strong>Contacting a company</strong><p>We request your specific approval before sending relevant evidence and correspondence to a verified company contact.</p><div style="margin-top:7px">${Pill(state.contactAuth?'Approved for selected request':'Separate approval required',state.contactAuth?'teal':'amber')}</div></div></div><div class="v6-permission"><div class="v6-badge">3</div><div><strong>ODPC complaint preparation and filing</strong><p>You decide after reviewing the company response. We then ask for final accuracy confirmation and separate filing authority as appropriate.</p><div style="margin-top:7px">${Pill(state.odpcAuth?'Pack preparation authorised':'Not automatically authorised',state.odpcAuth?'teal':'gray')}</div></div></div>${Btn('Back to my cases','toCasesV6','outline')}</div><div class="v6-card"><h3>Data we deliberately avoid</h3><div class="v6-privacylist"><div class="item"><strong>National ID images</strong><small>Provided directly to ODPC, not PrivacyGuard</small></div><div class="item"><strong>National ID number</strong><small>Never requested in this prototype</small></div><div class="item"><strong>Unrelated phone content</strong><small>Only chosen evidence; redact unrelated conversations</small></div><div class="item"><strong>Other users' cases</strong><small>No public or automatic group claims</small></div></div></div></div><div class="panel-stack"><div class="v6-card"><div class="eyebrow">${I('clipboard')} OUR APPROACH</div><h3>Only what the case needs</h3><p>A verified contact method, relevant messages, necessary correspondence, case-specific approvals and official ODPC reference, if one exists.</p><div class="v6-divider"></div><h3>You're still protected after you consent</h3><p>Consent does not eliminate security, minimisation, retention and lawful processing duties. Removing an upload later does not erase the fact that we processed it.</p></div><div class="v6-card"><h3>Case controls</h3><div class="result-list"><div class="result-line"><span>Selected case</span><strong>${esc(c.id)}</strong></div><div class="result-line"><span>Files</span><strong>${c.files.length} demo records</strong></div><div class="result-line"><span>ODPC reference</span><strong>${esc(c.odpcRef||'Not recorded')}</strong></div></div><div class="notice">${I('info')} In production, deletion and access requests would be processed under a documented retention policy, including legal holds when required.</div></div></div></div>`;}
function compliancePageV6(){let ready=state.cases.filter(c=>c.screened).length;let waiting=state.cases.filter(c=>c.status==='waiting').length;let action=state.communications.filter(m=>m.audience==='odpc'&&m.status==='action').length;return `<div class="page-header"><div><div class="eyebrow">${I('lock')} OPERATIONS / DATA GOVERNANCE</div><h1>Privacy & filing controls</h1><p>Operational safety gates, not a certification dashboard. All records and figures are fictional.</p></div>${Pill('Prototype safeguards','teal')}</div><div class="v6-opgrid"><div class="item"><strong>0</strong><span>ID photos retained by prototype</span></div><div class="item"><strong>${ready}</strong><span>Cases marked evidence-reviewed</span></div><div class="item"><strong>${action}</strong><span>ODPC communications needing response</span></div></div><div class="section-head"><h2>Non-negotiable release gates</h2></div><div class="tiles-2"><div class="v6-card"><h3>${I('shield',18)} Company-contact gate</h3><div class="timeline"><div class="event"><strong>Evidence available and screened</strong><p>A report is not proof of unlawful marketing.</p></div><div class="event"><strong>Responsible company and contact verified</strong><p>Never invent an address based on a sender alias.</p></div><div class="event"><strong>Case-specific customer authorisation</strong><p>Preview of the notice and exact destination before sending.</p></div></div></div><div class="v6-card"><h3>${I('scale',18)} ODPC handoff gate</h3><div class="timeline"><div class="event"><strong>Reviewed complaint pack</strong><p>Dates, screenshots, company correspondence, harm statement and requested remedy.</p></div><div class="event"><strong>Customer's fresh ODPC decision</strong><p>Separate from the company-contact permission.</p></div><div class="event"><strong>ID submitted directly to ODPC</strong><p>Never through the ordinary PrivacyGuard evidence upload.</p></div><div class="event"><strong>Verified ODPC status</strong><p>Submitted is not acknowledged; an award is not money received.</p></div></div></div></div><div class="section-head"><h2>Data protection operations</h2></div><div class="tiles-3"><div class="v6-card"><h3>Data minimisation</h3><p>Restrict capture to chosen evidence and necessary contact details. Provide redaction before company sharing.</p></div><div class="v6-card"><h3>Retention / deletion</h3><p>Set expiry rules for abandoned records and temporary artefacts, subject to statutory duties and legal holds.</p></div><div class="v6-card"><h3>Security & access</h3><p>Staff MFA, RLS, secure file scanning, audit trails, encrypted storage and incident response.</p></div></div><div class="notice" style="margin-top:18px">${I('alert')} This prototype has no backend, stores no uploaded ID images and performs no real deletion jobs, identity verification, email sending or ODPC filing.</div>`;}
function odpcStepsV6(c){const filed=!!c.odpcRef||c.status==='submitted'||c.status==='odpc';const ack=c.status==='odpc';const pack=!!c.packReady||['pack','submitted','odpc'].includes(c.status);const nodes=[['Decide','Your approval',true],['Prepare','Evidence pack',pack],['File','Directly on ODPC',filed],['Track','Verified regulator updates',ack]];let current=ack?4:filed?3:pack?2:1;return `<div class="v6-steps">${nodes.map(([name,sub,done],i)=>`<div class="v6-step ${i<current-1?'done':i===current-1?'current':''}"><div class="v6-circle">${i<current-1?'✓':i+1}</div><b>${name}</b><span>${sub}</span></div>`).join('')}</div>`;}
function demoPackV6(c){return `PRIVACYGUARD KENYA — DEMONSTRATION ODPC EVIDENCE PACK\nNOT AN OFFICIAL FILING | NO ID INFORMATION INCLUDED\n\nCase: ${c.id}\nAdvertiser: ${c.company} [fictional demonstration entity]\nSender: ${c.sender}\nChannel: ${c.channel}\nConcern: ${c.notes||'Promotional communication report'}\nEvidence files (example names only):\n${c.files.map(x=>' - '+x).join('\n')}\n\nChronology:\n${c.events.slice().reverse().map(e=>'- '+e.when+' | '+e.title+' | '+e.detail).join('\n')}\n\nPossible issues to review:\n- What is the lawful basis relied upon for direct marketing?\n- Was valid consent given and subsequently withdrawn?\n- What are the complainant's requested remedies and evidenced harm, if any?\n\nNo compensation is guaranteed. The ODPC decides independently.\n\nFINAL SUBMISSION INSTRUCTIONS:\n1. Consumer reviews all facts and confirms accuracy.\n2. Consumer opens https://cie.odpc.go.ke/Complaint directly.\n3. Consumer enters identity details and uploads ID documents TO ODPC ONLY.\n4. Consumer submits the complaint and returns with an official receipt/reference.\n5. PrivacyGuard tracks only verified correspondence and milestones.\n\nThis is a fictional prototype pack. It has no legal or regulatory effect.\n`;}
function odpcPageV6(){const c=getCase(),co=getCompany(c.company),pack=!!c.packReady||['pack','submitted','odpc'].includes(c.status),filed=!!c.odpcRef||['submitted','odpc'].includes(c.status);const checked=!!c.screened&&c.files.length>0&&!!co&&c.events.length>0;return `<button class="txtbtn" data-action="openCase">${I('back')} Back to case</button><div class="page-header" style="margin-top:15px"><div><div class="eyebrow">${I('scale')} FINAL STAGE · YOUR DECISION</div><h1>Take your complaint to ODPC</h1><p>A completed company review can lead to an ODPC complaint. The regulator independently decides whether a violation occurred and whether compensation is warranted.</p></div>${Pill(filed?'Submission details recorded':pack?'Pack ready · not filed':'Not filed','amber')}</div><div class="v6-columns"><div class="panel-stack"><div class="v6-card">${odpcStepsV6(c)}<div class="v6-highlight"><div class="icon-tile teal">${I('lock',20)}</div><div><span class="v6-label">Your National ID never enters PrivacyGuard</span><h3>You provide identification directly to ODPC</h3><p>We prepare evidence and correspondence. ODPC's official portal handles the ID number, ID images and its email verification. The prototype contains no ID collection fields.</p></div></div></div>${!pack?`<div class="v6-card"><div class="v6-label">Step 1 · Decide</div><h3>Should we prepare your ODPC complaint pack?</h3><p>Review the company response and the evidence before proceeding. Filing through ODPC is free, and compensation is not guaranteed.</p><div class="result-list" style="margin:13px 0"><div class="result-line"><span>Evidence received & reviewed</span><strong>${c.screened&&c.files.length?'Ready':'Needs staff review'}</strong></div><div class="result-line"><span>Company identity</span><strong>${co?'Directory match':'Further research needed'}</strong></div><div class="result-line"><span>Chronology / correspondence</span><strong>${c.events.length?'Available':'Not yet available'}</strong></div></div><label class="v6-permission"><input type="checkbox" id="odpcAuthority" ${state.odpcAuth?'checked':''}><span><strong>I request ODPC pack preparation for this case</strong><p>This is separate from permission to contact the company.</p></span></label><label class="v6-permission"><input type="checkbox" id="odpcFinalAccurate" ${state.odpcFinalAccurate?'checked':''}><span><strong>I confirm my account is accurate to the best of my knowledge</strong><p>I will review the final pack before independently submitting it to ODPC.</p></span></label><button class="button primary full" data-action="preparePackV6" ${!checked||!state.odpcAuth||!state.odpcFinalAccurate?'disabled':''}>${I('file')} Generate my ODPC evidence pack</button><p class="v6-fineprint" style="margin-top:11px">A lawyer is not mandatory for an ordinary ODPC complaint, but specialist legal help may be appropriate for complex issues.</p></div>`:`<div class="v6-card"><div class="topline"><div><div class="v6-label">Step 2 · Evidence pack prepared</div><h3>Review your complaint pack</h3></div>${Pill('Not an official filing','amber')}</div><p>This preview includes the case chronology, listed evidence and company correspondence. Review every detail before submitting to ODPC.</p><div class="v6-preview">${esc(demoPackV6(c).slice(0,1700))}</div><div class="action-group" style="margin-top:13px">${Btn(`${I('download')} Download demo pack`,'downloadPackV6','outline')}${Btn('View my permissions','openPrivacy','outline')}</div></div><div class="v6-card"><div class="v6-label">Step 3 · Submit directly to ODPC</div><h3>Only ODPC receives your ID photos</h3><p>Open ODPC's official complaints portal. Enter your ID details and upload identification there, not into PrivacyGuard. You may need to copy information from the prepared pack into the ODPC form.</p><div class="notice">${I('info')} This is a browser handoff, not automatic filing. PrivacyGuard cannot know that submission succeeded until an actual receipt or verified correspondence is recorded.</div><div class="action-group">${Btn(`Open official ODPC portal ${I('link')}`,'openPortal','primary')}${Btn('How to file without sharing ID with us','filingHelpV6','outline')}</div></div><div class="v6-card"><div class="v6-label">Step 4 · Come back after filing</div><h3>${filed?'Filing details recorded (demo)':'Have you submitted your complaint?'}</h3><p>After filing, enter your ODPC reference or acknowledgement details so the case can be tracked. This prototype only accepts references beginning with DEMO-.</p><div class="v6-ref"><input id="v6OdpcRef" aria-label="Sample ODPC reference" placeholder="DEMO-ODPC-1042" value="${esc(c.odpcRef||'')}"><button class="button outline" data-action="recordFilingV6">Record demo filing</button></div><p class="v6-fineprint">A reference reported by the customer is not automatically verified by ODPC. Our operations team must confirm the regulator's correspondence before marking it acknowledged.</p></div>`}</div><div class="panel-stack"><div class="v6-card"><div class="icon-tile amber">${I('scale',21)}</div><h3 style="margin-top:12px">Possible ODPC outcomes</h3><div class="timeline"><div class="event"><strong>Complaint dismissed or resolved</strong><p>No automatic compensation.</p></div><div class="event"><strong>Corrective action</strong><p>ODPC may require changes in data-handling practices.</p></div><div class="event"><strong>Compensation where justified</strong><p>Based on a violation, damage and relevant evidence, subject to legal challenge.</p></div></div><div class="notice warn">${I('alert')} There is no fixed payment per promotional message. An award does not establish that money has been received.</div></div><div class="v6-card"><h3>Current case</h3><div class="result-list"><div class="result-line"><span>PrivacyGuard reference</span><strong>${esc(c.id)}</strong></div><div class="result-line"><span>Company</span><strong>${esc(c.company)}</strong></div><div class="result-line"><span>ODPC ref</span><strong>${esc(c.odpcRef||'Not supplied')}</strong></div></div><div class="v6-divider"></div><h3>ODPC and PrivacyGuard are separate</h3><p>The official ODPC complaint is free. PrivacyGuard may charge only for separately agreed assistance, not for access to the regulator.</p></div></div></div>`;}
const oldOdpcPageV6=odpcPage;
odpcPage=odpcPageV6;
const oldMainActionV6=mainAction;
mainAction=function(action){let c=getCase();switch(action){
case 'openPrivacy':setView('privacy','consumer');return;
case 'toCasesV6':setView('cases','consumer');return;
case 'filingHelpV6':state.modal='filingHelpV6';renderModal();return;
case 'preparePackV6':{
 state.odpcAuth=!!document.getElementById('odpcAuthority')?.checked;state.odpcFinalAccurate=!!document.getElementById('odpcFinalAccurate')?.checked;
 let co=getCompany(c.company);if(!state.odpcAuth||!state.odpcFinalAccurate||!c.screened||!c.files.length||!co||!c.events.length){toast('Review and authorise this specific case and complete evidence checks before preparing a pack.');render(false);return;}
 c.packReady=true;c.status='pack';addEvent(c,'ODPC evidence pack generated (DEMO)','Customer approved case-specific pack preparation. NOT filed. No ID information collected.');toast('Demo pack prepared. National ID details are entered directly on ODPC only.');setView('odpc','consumer');return;}
case 'downloadPackV6':{if(!c.packReady&&!['pack','submitted','odpc'].includes(c.status)){toast('Prepare the pack first.');return;}const b=new Blob([demoPackV6(c)],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`PrivacyGuard_${c.id}_ODPC_DEMO_Pack.txt`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Demo text pack downloaded. No ID data included.');return;}
case 'recordFilingV6':{let ref=document.getElementById('v6OdpcRef')?.value.trim()||'';if(!/^DEMO-[A-Z0-9-]{4,40}$/i.test(ref)){toast('Use a fictional sample reference beginning DEMO-. No real ODPC reference is stored.');return;}c.odpcRef=ref;c.status='submitted';c.packReady=true;addEvent(c,'Consumer-reported filing details saved (DEMO)',`Reference: ${ref}. Awaiting independent ODPC verification.`);state.communications.unshift({id:'DEMO-'+Date.now(),caseId:c.id,audience:'odpc',direction:'out',title:'Consumer-reported ODPC filing (demo)',detail:'Unverified sample filing reference',contact:'ODPC official portal · example',date:today,status:'submitted',verified:false});toast('Sample reference recorded, not verified or acknowledged by ODPC.');render();return;}
case 'submitReport':{state.dataProcessingApproved=!!document.getElementById('dataProcessingApproval')?.checked;if(!state.dataProcessingApproved){toast('Please review and approve case-data processing before continuing.');render(false);return;}return oldMainActionV6(action);}
case 'openODPC':state.odpcAuth=false;state.odpcFinalAccurate=false;return oldMainActionV6(action);
default:return oldMainActionV6(action);
}};
const oldBottomNavV6=bottomNav;
bottomNav=function(){const wanted=state.role==='consumer'?['home','report','cases','privacy','help']:['overview','queue','inbox','odpcops','compliance'];const items=navItems().filter(([view])=>wanted.includes(view));return `<nav class="mobile-nav" aria-label="Primary navigation">${items.map(([view,ico,name])=>`<button class="${navSelected(view)?'active':''}" data-nav="${view}">${I(ico)}<span>${({report:'Report',cases:'My cases',privacy:'Privacy',help:'ODPC',overview:'Overview',queue:'Review',inbox:'Emails',odpcops:'ODPC',compliance:'Privacy'})[view]||name}</span></button>`).join('')}</nav>`;};
const oldPublicLandingV6=publicLanding;
publicLanding=function(){return oldPublicLandingV6().replace('Free message check · ODPC filing is free · Paid help is optional','Free to check · No ID images collected · ODPC filing is free · Optional paid help');};
const oldStartReportV6=startReport;
startReport=function(goal){state.dataProcessingApproved=false;return oldStartReportV6(goal);};
const oldRenderModalV6=renderModal;
renderModal=function(){if(state.modal!=='filingHelpV6')return oldRenderModalV6();document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-action="closeModal"><div class="modal-card" role="dialog" aria-modal="true" aria-label="Direct filing guide" onclick="event.stopPropagation()"><div class="modal-header"><h2>ODPC filing without handing PrivacyGuard your ID</h2><button class="iconbtn" data-action="closeModal" aria-label="Close">${I('x')}</button></div><div class="timeline"><div class="event"><strong>Download your prepared pack</strong><p>Check the contents and keep your evidence ready.</p></div><div class="event"><strong>Open cie.odpc.go.ke/Complaint</strong><p>Use ODPC's own website, not a PrivacyGuard upload field.</p></div><div class="event"><strong>Enter identification directly with ODPC</strong><p>Upload the required ID/passport image and complete any email verification on the official site.</p></div><div class="event"><strong>Submit, then return here</strong><p>Record your reference or acknowledgement for tracking; our team verifies actual correspondence.</p></div></div><div class="action-group">${Btn('Open ODPC portal','openPortal','primary')}${Btn('Close','closeModal','outline')}</div></div></div>`;};
document.addEventListener('change',e=>{if(e.target.id==='dataProcessingApproval'){state.report.confirmed=!!document.getElementById('reportAccurate')?.checked;state.dataProcessingApproved=e.target.checked;render(false);}if(e.target.id==='reportAccurate'){state.report.confirmed=e.target.checked;}if(e.target.id==='odpcFinalAccurate'){state.odpcFinalAccurate=e.target.checked;render(false);}});

render();
</script>
</body>
